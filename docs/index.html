<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Babou Art">
<meta name="theme-color" content="#1a0b2e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Montserrat:wght@800&family=Pacifico&family=Permanent+Marker&display=swap">
<title>Babou Art</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="menuBtn" class="ghost" aria-label="Menu">🍭</button>
  <button id="ratioBtn" class="chip">9:16</button>
  <div class="spacer"></div>
  <button id="undoBtn" class="ghost" aria-label="Annuler">↩️</button>
  <button id="redoBtn" class="ghost" aria-label="Rétablir">↪️</button>
  <button id="exportBtn" class="btn primary">Exporter</button>
</header>

<main id="stage">
  <canvas id="view" hidden></canvas>
  <div id="empty">
    <img class="logo" src="icon-192.png" alt="">
    <h2>Babou Art</h2>
    <p class="muted">Monte tes TikToks, Reels et visuels directement sur ton iPhone.</p>
    <button id="startBtn" class="btn primary big">＋ Nouveau projet</button>
  </div>
</main>

<div id="transport" hidden>
  <span id="tcur">0:00</span>
  <button id="playBtn" class="play">▶</button>
  <span id="ttot">0:00</span>
  <div class="spacer"></div>
  <button id="zoomOut" class="ghost sm">➖</button>
  <button id="zoomIn" class="ghost sm">➕</button>
</div>

<div id="tlWrap" hidden>
  <div id="timeline"><div id="tlInner"></div></div>
  <div id="playhead"></div>
</div>

<nav id="tools"></nav>

<div id="sheet" hidden>
  <div class="sheet-head"><span id="sheetTitle"></span><button id="sheetClose" class="ok">✓</button></div>
  <div id="sheetBody"></div>
</div>

<div id="overlay" hidden>
  <div class="box">
    <div id="ovText"></div>
    <progress id="ovProg" max="1"></progress>
    <div id="ovBtns"></div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="mediaHost" aria-hidden="true"></div>
<script type="module" src="app.js"></script>
</body>
</html>
