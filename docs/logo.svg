<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fb8"/><stop offset=".55" stop-color="#b03bd8"/><stop offset="1" stop-color="#3a1670"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#d98a00"/></linearGradient>
    <radialGradient id="face" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ead9ff"/><stop offset="1" stop-color="#c6a8f0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a0530" flood-opacity=".45"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="70" fill="#ffffff" opacity=".10"/>
  <circle cx="70" cy="450" r="110" fill="#ffffff" opacity=".07"/>
  <!-- anneaux latéraux -->
  <g filter="url(#sh)">
