    <ellipse cx="416" cy="270" rx="34" ry="78" fill="none" stroke="url(#gold)" stroke-width="20"/>
    <!-- bulle principale -->
    <circle cx="256" cy="268" r="148" fill="url(#face)"/>
    <!-- bandeau rose -->
    <path d="M128 200 Q256 96 384 200 Q330 168 256 166 Q182 168 128 200Z" fill="#ff4fae"/>
    <path d="M352 150 q46 -22 62 8 q-30 2 -44 22z" fill="#ff4fae"/>
