  </g>
  <!-- étincelles -->
  <path d="M388 360 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#9dff6a"/>
  <path d="M120 120 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z" fill="#fff1a8"/>
