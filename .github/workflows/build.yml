name: Partitions de Titi — compilation universelle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versions (macOS, Xcode, SDK)
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK macOS : $(xcrun --sdk macosx --show-sdk-version)"
          swift --version
          uname -m

      - name: Banque de sons
        run: scripts/fetch-soundfont.sh

      - name: Tests unitaires
        run: swift test

      - name: Application universelle + DMG
        run: scripts/build-app.sh

      - name: Vérification universelle (lipo)
        run: |
          INFO=$(lipo -info "build/Partitions de Titi.app/Contents/MacOS/PartiMac")
          echo "$INFO"
          echo "$INFO" | grep -q arm64
          echo "$INFO" | grep -q x86_64
          vtool -show-build "build/Partitions de Titi.app/Contents/MacOS/PartiMac" | grep -E "minos|platform" | head -4

      - name: Auto-test (arm64)
        run: |
          set -o pipefail
          "build/Partitions de Titi.app/Contents/MacOS/PartiMac" --selftest build/selftest-arm64 | tee build/selftest-arm64.log

      - name: Auto-test (x86_64 via Rosetta)
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "build/Partitions de Titi.app/Contents/MacOS/PartiMac" --selftest build/selftest-x86_64
          else
            echo "Rosetta indisponible sur ce runner : test x86_64 ignoré"
          fi

      - name: Lancement par double-clic (open)
        run: |
          open "build/Partitions de Titi.app"
          sleep 10
          pgrep -x PartiMac
          pkill -x PartiMac || true

      - name: Captures d'écran dans le dépôt (docs/captures)
        if: github.event_name == 'push'
        run: |
          mkdir -p docs/captures
          for f in build/selftest-arm64/*.png; do
            sips -s format jpeg -s formatOptions 70 "$f" --out "docs/captures/$(basename "${f%.png}").jpg" >/dev/null
          done
          sips -s format png build/AppIcon.iconset/icon_256x256@2x.png --out docs/captures/icone.png >/dev/null
          git config user.name "CI Partitions de Titi"
          git config user.email "ci@partimac.invalid"
          git add docs/captures
          if ! git diff --cached --quiet; then
            git commit -m "Captures de l'auto-test [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Captures non poussées (branche modifiée entre-temps)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Partitions-de-Titi-dmg
          path: build/Partitions-de-Titi.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autotest
          path: build/selftest-*
